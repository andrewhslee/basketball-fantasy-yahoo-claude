[project]
name = "yahoo-fantasy-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read and manage a Yahoo Fantasy Basketball team"
readme = "README.md"
authors = [
    { name = "Andrew Lee", email = "andrewhanselee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "xmltodict>=1.0.4",
]

[project.scripts]
yahoo-fantasy-mcp = "yahoo_fantasy_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
